title: "Quick Crop"
tooltip: |-
  VI: Quét vùng chữ nhật để crop Plan / Section / Elevation, kể cả view xoay, với khoảng đệm
  500 mm. Giữ chiều sâu crop hiện tại, bật và hiện Crop Box rồi Zoom to Fit. Crop phác thảo
  được đổi thành chữ nhật. Cần Scope Box = None; chưa hỗ trợ Split Crop.

  EN: Draw a rectangle to crop a plan, section or elevation, including rotated views, with
  a 500 mm margin. Preserves crop depth, enables and shows the Crop Box, then zooms to fit.
  Replaces a sketched crop with a rectangle. Requires Scope Box = None; split crops are unsupported.
