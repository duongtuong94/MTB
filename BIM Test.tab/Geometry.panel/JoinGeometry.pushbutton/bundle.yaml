title: Join Geometry
tooltip: |-
  VI: Join Geometry theo các cặp Category và thứ tự ưu tiên trong vùng chọn hoặc view hiện tại. Có
  thể đảo từng cặp để điều chỉnh thứ tự cắt.

  EN: Join geometry using Category pairs and their priority order within the current selection or
  active view. Reverse individual pairs to control the cutting order.

