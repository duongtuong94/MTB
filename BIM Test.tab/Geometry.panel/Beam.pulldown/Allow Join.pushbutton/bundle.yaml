title:   
  en_us: Allow Join Beam
tooltip: |-
  VI: Chọn trước các dầm rồi chạy tool để cho phép Join tại cả đầu Start và End. Phần tử không hỗ
  trợ thao tác sẽ được bỏ qua.

  EN: Preselect beams, then run to allow joins at both the Start and End. Elements that do not
  support the operation are skipped.

